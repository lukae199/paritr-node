[package]
name = "paritr-node"
version = "4.0.1-rc.4"
edition = "2021"
rust-version = "1.98"
description = "Paritr Protocol 9 full node"
publish = false

[lib]
name = "paritr"
path = "src/lib.rs"

[[bin]]
name = "paritr-node"
path = "src/main.rs"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
libloading = "0.8"
mdns-sd = "0.20.2"
parking_lot = "0.12"
primitive-types = { version = "0.13", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ripemd = "0.1"
rusqlite = { version = "0.32", features = ["modern_sqlite"] }
secp256k1 = { version = "0.30", features = ["global-context", "rand", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
