name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: 'cargo test --lib --locked consensus::'

  unix-bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build locked Rust binary
        run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Build pinned RandomX v1
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch v1.2.3 https://github.com/tevador/RandomX.git RandomX
          test "$(git -C RandomX rev-parse HEAD)" = 12f2c2ffe2108d6cf54c391fee33c8bc3646cdab
          linker_flags=()
          if [[ '${{ matrix.target }}' == *-linux-gnu ]]; then
            linker_flags+=("-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,noexecstack")
          fi
          cmake -S RandomX -B RandomX/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DBUILD_SHARED_LIBS=ON "${linker_flags[@]}"
          cmake --build RandomX/build --config Release --parallel
      - name: Package
        shell: bash
        run: |
          name="paritr-node-${{ matrix.target }}"
          mkdir -p "dist/$name/lib" "artifacts"
          cp "target/${{ matrix.target }}/release/paritr-node" "dist/$name/"
          rx="$(find RandomX/build -type f \( -name 'librandomx.so' -o -name 'librandomx.dylib' \) | head -n 1)"
          test -n "$rx"
          if [[ '${{ matrix.target }}' == *-linux-gnu ]]; then
            readelf -W -l "$rx" | awk '/GNU_STACK/ { found=1; if ($0 ~ /RWE/) exit 1 } END { if (!found) exit 1 }'
          fi
          export PARITR_RANDOMX_LIBRARY="$rx"
          "target/${{ matrix.target }}/release/paritr-node" --config "$RUNNER_TEMP/paritr-release-check/config.json" check
          cp -L "$rx" "dist/$name/lib/"
          cp RandomX/LICENSE "dist/$name/RandomX-LICENSE"
          cp manage.sh packaging/paritr-node.freebsd-rc README.md INSTALLATION.md NODE-START.md BUILDING.md MIGRATION.md SECURITY.md "dist/$name/"
          tar -C dist -czf "artifacts/$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "artifacts/$name.tar.gz" > "artifacts/$name.tar.gz.sha256"
          else shasum -a 256 "artifacts/$name.tar.gz" > "artifacts/$name.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  windows-bundle:
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            cmake_arch: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            cmake_arch: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo build --release --locked --target '${{ matrix.target }}'
      - shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch v1.2.3 https://github.com/tevador/RandomX.git RandomX
          if ($LASTEXITCODE -ne 0) { throw 'RandomX download failed' }
          if ((git -C RandomX rev-parse HEAD).Trim() -ne '12f2c2ffe2108d6cf54c391fee33c8bc3646cdab') { throw 'RandomX tag identity mismatch' }
          # Upstream enables SSSE3 for every MSVC target, including ARM64.
          git -C RandomX apply --check "$env:GITHUB_WORKSPACE/packaging/randomx-msvc-ssse3.patch"
          if ($LASTEXITCODE -ne 0) { throw 'RandomX MSVC patch does not match pinned source' }
          git -C RandomX apply "$env:GITHUB_WORKSPACE/packaging/randomx-msvc-ssse3.patch"
          if ($LASTEXITCODE -ne 0) { throw 'RandomX MSVC patch failed' }
          $rxOptions = @()
          if ('${{ matrix.cmake_arch }}' -eq 'ARM64') {
            # v1.2.3's A64 JIT uses GNU/POSIX assembly, unsupported by MSVC.
            # MSVC _M_ARM64 already selects the portable interpreter in common.hpp.
            # Suppress the incompatible assembly sources in CMake as well.
            $rxOptions += '-DARM_ID=portable'
          }
          cmake -S RandomX -B RandomX/build -A '${{ matrix.cmake_arch }}' -DCMAKE_BUILD_TYPE=Release -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DBUILD_SHARED_LIBS=ON -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_CXX_FLAGS=/fp:strict @rxOptions
          if ($LASTEXITCODE -ne 0) { throw 'RandomX configure failed' }
          cmake --build RandomX/build --config Release --target randomx --parallel
          if ($LASTEXITCODE -ne 0) { throw 'RandomX compilation failed' }
          $target = '${{ matrix.target }}'
          $name = "paritr-node-$target"
          New-Item -ItemType Directory -Force -Path "dist/$name", artifacts | Out-Null
          Copy-Item "target/$target/release/paritr-node.exe" "dist/$name/"
          $dll = Get-ChildItem RandomX/build -Recurse -File | Where-Object { $_.Name -in @('randomx.dll','librandomx.dll') } | Select-Object -First 1
          if (-not $dll) { throw 'RandomX DLL missing' }
          $env:PARITR_RANDOMX_LIBRARY = $dll.FullName
          & "target/$target/release/paritr-node.exe" --config "$env:RUNNER_TEMP/paritr-release-check/config.json" check
          if ($LASTEXITCODE -ne 0) { throw 'Release self-check failed' }
          Copy-Item $dll.FullName "dist/$name/randomx.dll"
          Copy-Item RandomX/LICENSE "dist/$name/RandomX-LICENSE"
          Copy-Item manage.ps1,README.md,INSTALLATION.md,NODE-START.md,BUILDING.md,MIGRATION.md,SECURITY.md "dist/$name/"
          Remove-Item Env:PARITR_RANDOMX_LIBRARY
          ./scripts/smoke-management.ps1 -Binary (Resolve-Path "dist/$name/paritr-node.exe").Path
          Compress-Archive -Path "dist/$name" -DestinationPath "artifacts/$name.zip"
          $hash = (Get-FileHash "artifacts/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "artifacts/$name.zip.sha256" -Encoding ASCII
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  container_image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.names.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -n 1)"
          test "$version" = "$cargo_version"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Sign immutable image digest
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  publish:
    needs: [validation, unix-bundles, windows-bundle, container_image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: true
      - name: Prepare release metadata and checksums
        env:
          IMAGE: ${{ needs.container_image.outputs.image }}
          DIGEST: ${{ needs.container_image.outputs.digest }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat >artifacts/release.env <<EOF
          PARITR_RELEASE_VERSION=$version
          PARITR_PROTOCOL_VERSION=9
          PARITR_IMAGE_REF=$IMAGE@$DIGEST
          EOF
          git archive --format=tar.gz --prefix="paritr-node-$version-source/" -o "artifacts/paritr-node-$version-source.tar.gz" HEAD
          cp bootstrap.sh bootstrap.ps1 setup.sh setup.ps1 install.sh install.ps1 manage.sh manage.ps1 docker-compose.release.yml INSTALLATION.md NODE-START.md DELIVERY.md artifacts/
          (
            cd artifacts
            for file in *; do
              case "$file" in *.sha256|SHA256SUMS) continue ;; esac
              sha256sum "$file" >"$file.sha256"
            done
            sha256sum -- * | grep -vE '(\.sha256|SHA256SUMS)$' >SHA256SUMS
          )
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Sign checksum manifest
        run: cosign sign-blob --yes --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Paritr $GITHUB_REF_NAME"
          files=(artifacts/*)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
