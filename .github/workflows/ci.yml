name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: bash -n bootstrap.sh setup.sh install.sh manage.sh packaging/paritr-node.freebsd-rc
      - run: sh -n bootstrap.sh
      - run: PARITR_IMAGE_REF=ghcr.io/example/paritr@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa docker compose -f docker-compose.release.yml config --quiet
      - run: python3 -m json.tool spec/test-vectors.json >/dev/null

  native-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-2025
            platform: windows-x64
          - runner: windows-11-arm
            platform: windows-arm64-core
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show
      - run: cargo test --all-targets --locked

  randomx-abi-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build portable pinned RandomX v1
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch v1.2.3 https://github.com/tevador/RandomX.git RandomX
          test "$(git -C RandomX rev-parse HEAD)" = 12f2c2ffe2108d6cf54c391fee33c8bc3646cdab
          cmake -S RandomX -B RandomX/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build RandomX/build --config Release --parallel
      - name: Exercise the RandomX ABI and official v1 hash vector
        shell: bash
        run: |
          rx="$(find RandomX/build -type f -name 'librandomx.so' | head -n 1)"
          test -n "$rx"
          export PARITR_RANDOMX_LIBRARY="$rx"
          cargo run --locked -- --config "$RUNNER_TEMP/paritr-smoke/config.json" check

  powershell-syntax:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('bootstrap.ps1','setup.ps1','install.ps1','manage.ps1','scripts/prepare-download-root.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; $failed = $true }
          }
          if ($failed) { exit 1 }
