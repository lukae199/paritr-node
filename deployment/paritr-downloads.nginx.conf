# Include inside the HTTPS server block for paritr.highactive.de.
# /srv/paritr-downloads is prepared by scripts/prepare-download-root.sh.

location = /downloads {
    return 308 /downloads/;
}

# Stable bootstrap pointers must be revalidated on every request.
location ~ ^/downloads/(bootstrap|setup)\.(sh|ps1)(\.sha256)?$ {
    alias /srv/paritr-downloads/$1.$2$3;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}

# Versioned assets are immutable.
location /downloads/ {
    alias /srv/paritr-downloads/;
    autoindex off;
    try_files $uri =404;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
